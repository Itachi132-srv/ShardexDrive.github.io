<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shardex Drive Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(40, 30, 20, 0.85);
            border: 2px solid #b5651d;
            padding: 10px 22px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .btn {
            width: 75px;
            height: 75px;
            background: rgba(240, 240, 240, 0.85);
            border: 3px solid #666;
            border-radius: 14px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
        }
        .btn:active, .btn.active {
            background: rgba(200, 200, 200, 0.95);
            transform: scale(0.92);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ff4444;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: white;
            display: none;
            z-index: 100;
        }
        #game-over h1 { margin-top: 0; color: #ff4444; }
        #game-over button {
            background: #ff4444;
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="hud-panel">Speed: <span id="speed-val">0</span> km/h</div>
        <div class="hud-panel">Distance: <span id="dist-val">0</span> m</div>
    </div>

    <div id="controls">
        <div class="control-group">
            <div class="btn" id="btn-left">&lt;</div>
            <div class="btn" id="btn-right">&gt;</div>
        </div>
        <div class="control-group">
            <div class="btn" id="btn-down">BRK</div>
            <div class="btn" id="btn-up">ACC</div>
        </div>
    </div>

    <div id="game-over">
        <h1>CRASHED!</h1>
        <p>Total Distance: <span id="final-dist">0</span> m</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    
    <!-- Game Script -->
    <script src="script.js"></script>
</body>
</html>
